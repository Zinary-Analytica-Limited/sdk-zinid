name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Also the secret-scanning backstop: `pnpm lint` runs `eslint .`, which
      # includes eslint-plugin-no-secrets. The pre-commit hook enforcing the
      # same rule is bypassable with `--no-verify`; this is not.
      - name: Lint and secret scan
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Runs unit tests and the size budget (build + size-limit) via the package test script.
      - name: Test
        run: pnpm test
